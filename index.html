    .eyebrow { margin: 0 0 18px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .hero h1 { max-width: 520px; margin: 0; font-family: var(--serif); font-size: clamp(38px, 5vw, 64px); font-weight: 500; line-height: 1.18; }

    @media (hover: none) { .add-button { opacity: 1; transform: none; } }
    @media (max-width: 800px) {

      .filters { align-items: end; }
      .categories { gap: 17px; }
      .sort { max-width: 100px; font-size: 11px; }
      .product-info { flex-direction: column; gap: 7px; }
      .add-button { right: 7px; bottom: 7px; left: 7px; padding: 9px; font-size: 11px; }
      .footer { align-items: flex-start; flex-direction: column; }
      .modal { padding: 22px 18px; }
    }

    <div class="modal" id="modal-content"></div>
  </div>

  <script>
    const products = [
      { id: 1, name: "晨霧手捏陶杯", category: "器物", detail: "台灣手作・霧白", price: 680, badge: "手作選物", image: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=800&q=80" },
      { id: 2, name: "午後亞麻桌巾", category: "居家", detail: "天然亞麻・燕麥", price: 980, badge: "人氣商品", image: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=800&q=80" },
      { id: 3, name: "山形香氛蠟燭", category: "香氛", detail: "雪松與白茶・180g", price: 790, badge: "新品上市", image: "https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=800&q=80" },
      { id: 4, name: "弧線玻璃花器", category: "器物", detail: "吹製玻璃・透明", price: 1_280, badge: "限量選物", image: "https://images.unsplash.com/photo-1578500494198-246f612d3b3d?auto=format&fit=crop&w=800&q=80" },
      { id: 5, name: "日光編織收納籃", category: "居家", detail: "天然棉繩・手工編織", price: 1_180, badge: "自然材質", image: "https://images.unsplash.com/photo-1593085260707-5377ba37f868?auto=format&fit=crop&w=800&q=80" },
      { id: 6, name: "留白線香座", category: "香氛", detail: "陶作・砂岩色", price: 520, badge: "手作選物", image: "https://images.unsplash.com/photo-1602874801007-bd458bb1b8b6?auto=format&fit=crop&w=800&q=80" },
      { id: 7, name: "森林漫步掛布", category: "居家", detail: "有機棉・植物染", price: 1_450, badge: "本週推薦", image: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=800&q=80" },
      { id: 8, name: "慢煮手沖咖啡壺", category: "器物", detail: "耐熱玻璃・450ml", price: 1_080, badge: "日常必備", image: "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80" }
    ];
    const categories = ["全部商品", "居家", "器物", "香氛"];
    let activeCategory = "全部商品";
    let cart = JSON.parse(localStorage.getItem("everyday-cart") || "[]");
    const money = value => `$${value.toLocaleString("en-US")}`;
    const grid = document.querySelector("#products-grid");
    const cartDrawer = document.querySelector("#cart-drawer");
    const overlay = document.querySelector("#overlay");
    const modal = document.querySelector("#checkout-modal");
    const cartTotal = () => cart.reduce((sum, item) => sum + products.find(product => product.id === item.id).price * item.quantity, 0);
    const shippingFee = total => total >= 1500 ? 0 : 80;

    // AIQUA custom data. Names follow [a-z_][a-z0-9_]*; keep each param's type stable across logs.
    const track = (name, params, valueToSum) => window.qg && window.qg("event", name, params, valueToSum);
    const productParams = product => ({ product_id: product.id, product_name: product.name, category: product.category, price: product.price });
    // AIQUA phoneNo: country code + digits only. Local TW numbers (09xx…) become 8869xx….
    const toPhoneNo = phone => { const digits = phone.replace(/\D/g, ""); return digits.startsWith("0") ? `886${digits.slice(1)}` : digits; };

    function renderCategories() {
      document.querySelector("#categories").innerHTML = categories.map(category => `<button type="button" class="category ${category === activeCategory ? "active" : ""}" data-category="${category}">${category}</button>`).join("");
    }

    function renderProducts() {
      const query = document.querySelector("#search").value.trim().toLowerCase();
      const sort = document.querySelector("#sort").value;
      let visible = products.filter(product => (activeCategory === "全部商品" || product.category === activeCategory) && `${product.name} ${product.detail} ${product.category}`.toLowerCase().includes(query));
      if (sort === "price-asc") visible = [...visible].sort((a, b) => a.price - b.price);
      if (sort === "price-desc") visible = [...visible].sort((a, b) => b.price - a.price);
      document.querySelector("#result-count").textContent = `共 ${visible.length} 件選物`;
      grid.innerHTML = visible.length ? visible.map(product => `<article class="product-card">
        <div class="product-image-wrap"><img class="product-image" src="${product.image}" alt="${product.name}" loading="lazy"><span class="tag">${product.badge}</span><button class="add-button" type="button" data-add="${product.id}">加入購物袋</button></div>
        <div class="product-info"><div><h3>${product.name}</h3><p>${product.detail}</p></div><span class="price">${money(product.price)}</span></div>
      </article>`).join("") : `<div class="empty-state">找不到符合條件的商品，試試其他關鍵字吧。</div>`;
    }

    function saveCart() {
      localStorage.setItem("everyday-cart", JSON.stringify(cart));
      renderCart();
    }

    function renderCart() {
      const count = cart.reduce((sum, item) => sum + item.quantity, 0);
      const total = cart.reduce((sum, item) => sum + products.find(product => product.id === item.id).price * item.quantity, 0);
      document.querySelector("#cart-count").textContent = count;
      document.querySelector("#subtotal").textContent = money(total);
      document.querySelector("#shipping-note").textContent = total >= 1500 ? "已符合免運資格" : `再選 ${money(1500 - total)} 即享免運`;
      document.querySelector("#checkout").disabled = count === 0;
      document.querySelector("#cart-items").innerHTML = cart.length ? cart.map(item => {
        const product = products.find(entry => entry.id === item.id);
        return `<article class="cart-row"><img src="${product.image}" alt=""><div><h3>${product.name}</h3><p>${money(product.price)}</p><div class="quantity"><button type="button" data-quantity="${product.id}" data-delta="-1" aria-label="減少數量">−</button><span>${item.quantity}</span><button type="button" data-quantity="${product.id}" data-delta="1" aria-label="增加數量">＋</button></div></div><button class="remove" type="button" data-remove="${product.id}">移除</button></article>`;
      }).join("") : `<div class="cart-empty">購物袋還是空的，去挑幾件喜歡的吧。</div>`;
    }

    function setCartOpen(open) {
      cartDrawer.classList.toggle("open", open);
      overlay.classList.toggle("open", open);
      cartDrawer.setAttribute("aria-hidden", String(!open));
      document.body.style.overflow = open ? "hidden" : "";
    }

    function openCheckout() {
      const total = cart.reduce((sum, item) => sum + products.find(product => product.id === item.id).price * item.quantity, 0);
      document.querySelector("#modal-content").innerHTML = `<div class="modal-heading"><div><h2 id="checkout-title">完成這份日常</h2><p>填寫收件資訊，確認你的選物。</p></div><button class="icon-button" id="close-checkout" type="button" aria-label="關閉結帳視窗">×</button></div>
        <form id="order-form"><div class="form-grid">
          <div class="field"><label for="customer-name">收件人</label><input id="customer-name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="customer-phone">聯絡電話</label><input id="customer-phone" name="phone" type="tel" autocomplete="tel" pattern="[0-9+() -]{8,}" required></div>
          <div class="field full"><label for="customer-email">電子郵件</label><input id="customer-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field full"><label for="customer-address">配送地址</label><input id="customer-address" name="address" autocomplete="street-address" required></div>
          <div class="field full"><label for="payment">付款方式</label><select id="payment" name="payment"><option>貨到付款（展示）</option><option>信用卡（展示）</option><option>轉帳付款（展示）</option></select></div>
        </div><div class="order-total"><span>訂單總額${total >= 1500 ? "（含免運）" : "（含運費 $80）"}</span><strong>${money(total + (total >= 1500 ? 0 : 80))}</strong></div><button class="submit-order" type="submit">確認訂單</button><p class="demo-note">此為靜態展示網站，不會實際付款或配送。收件人、電話、電子郵件與訂單內容會送到 AIQUA 作為測試資料，請填寫假資料。</p></form>`;
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeCheckout() {
      modal.classList.remove("open");
      document.body.style.overflow = cartDrawer.classList.contains("open") ? "hidden" : "";
    }

    renderCategories();
    renderProducts();
    renderCart();

    document.querySelector("#categories").addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (button) { activeCategory = button.dataset.category; renderCategories(); renderProducts(); }
    });
    document.querySelectorAll("[data-nav-category]").forEach(link => link.addEventListener("click", () => {
      activeCategory = link.dataset.navCategory; renderCategories(); renderProducts();
    }));
    document.querySelector("#search").addEventListener("input", renderProducts);
    document.querySelector("#sort").addEventListener("change", renderProducts);
    grid.addEventListener("click", event => {
      const button = event.target.closest("[data-add]");
      if (!button) return;
      const id = Number(button.dataset.add);
      const item = cart.find(entry => entry.id === id);
      if (item) item.quantity += 1;
      else cart.push({ id, quantity: 1 });
      saveCart();
      track("product_added_to_cart", { ...productParams(products.find(product => product.id === id)), quantity: 1 });
      button.textContent = "已加入 ✓";
      window.setTimeout(() => { if (button.isConnected) button.textContent = "加入購物袋"; }, 1000);
    });
    document.querySelector("#cart-items").addEventListener("click", event => {
      const quantityButton = event.target.closest("[data-quantity]");
      const removeButton = event.target.closest("[data-remove]");
      if (quantityButton) {
        const id = Number(quantityButton.dataset.quantity);
        const item = cart.find(entry => entry.id === id);
        item.quantity += Number(quantityButton.dataset.delta);
        if (item.quantity <= 0) cart = cart.filter(entry => entry.id !== id);
        saveCart();
      }
      if (removeButton) { cart = cart.filter(item => item.id !== Number(removeButton.dataset.remove)); saveCart(); }
    });
    document.querySelector("#open-cart").addEventListener("click", () => setCartOpen(true));
    document.querySelector("#close-cart").addEventListener("click", () => setCartOpen(false));
    overlay.addEventListener("click", () => setCartOpen(false));
    document.querySelector("#checkout").addEventListener("click", () => {
      track("checkout_started", { cart_total: cartTotal(), item_count: cart.reduce((sum, item) => sum + item.quantity, 0) });
      setCartOpen(false);
      openCheckout();
    });
    modal.addEventListener("click", event => { if (event.target === modal || event.target.closest("#close-checkout")) closeCheckout(); });
    modal.addEventListener("submit", event => {
      if (event.target.id !== "order-form") return;
      event.preventDefault();
      if (!event.target.reportValidity()) return;
      const orderId = `DS${Date.now().toString().slice(-7)}`;
      const form = new FormData(event.target);
      const subtotal = cartTotal();
      window.qg && window.qg("identify", { email: form.get("email").trim(), phoneNo: toPhoneNo(form.get("phone")), name: form.get("name").trim() });
      cart.forEach(item => track("product_purchased", { ...productParams(products.find(product => product.id === item.id)), quantity: item.quantity, order_id: orderId }));
      track("checkout_completed", { order_id: orderId, subtotal, shipping_fee: shippingFee(subtotal), total: subtotal + shippingFee(subtotal), item_count: cart.reduce((sum, item) => sum + item.quantity, 0), payment_method: form.get("payment") }, subtotal + shippingFee(subtotal));
      cart = [];
      saveCart();
      document.querySelector("#modal-content").innerHTML = `<div class="success"><span class="success-mark">✓</span><h2>謝謝你的選擇</h2><p>示範訂單 <strong>${orderId}</strong> 已建立。<br>這是靜態網站，不會實際處理付款或配送。</p><button class="submit-order" id="finish-order" type="button">回到商店</button></div>`;
      document.querySelector("#finish-order").addEventListener("click", closeCheckout);
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") { setCartOpen(false); closeCheckout(); }
    });
  </script>
